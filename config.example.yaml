# AGT Galactic Trivia configuration (CFG-4).
#
# Copy this file to config.yaml and uncomment what you want to change. Every
# key is optional; the value shown is its default. An unknown key or an
# invalid value stops the server with a message naming the key.
#
# Secrets never go here: they go in .env (see .env.example). The app never
# writes this file.
#
# The keys under "Keys that can also be set in the dashboard" can be changed in
# the admin dashboard's Settings tab too. The configuration file wins: a key set
# here is shown read-only in the dashboard and cannot be changed there.

# --- Config-file-only keys -------------------------------------------------

# server:
#   # Listen address. Default: AGT_TRIVIA_SERVER_HOST if set (0.0.0.0 in the
#   # Docker image), else 127.0.0.1, so only this machine can connect.
#   host: 127.0.0.1
#   port: 8082
#   # Trust X-Forwarded-* headers from a TLS reverse proxy: true, or the proxy's
#   # address or CIDR range (a string or a list). false ignores the headers.
#   trustProxy: false
#   # fatal, error, warn, info, debug, trace or silent (stdout).
#   logLevel: info

# storage:
#   # Where the app keeps its data, relative to the working directory.
#   dataDir: data
#   # The SQLite database file, relative to dataDir.
#   databaseFile: agt-trivia.sqlite
#   # The log store: the server log and the audit log, relative to dataDir.
#   # It is never part of a backup.
#   logDatabaseFile: logs.sqlite
#   # Pre-restore backups and the temporary files of backups and restores,
#   # relative to dataDir.
#   backupsDir: backups

# session:
#   # How long an Admin or member sign-in lasts, in hours (1-168).
#   ttlHours: 12
#   # Whether session cookies are marked Secure: auto (when the request came
#   # over HTTPS; behind a proxy that needs server.trustProxy), true or false.
#   secureCookie: auto

# rateLimits:
#   # At most max requests per client address in windowMinutes (SEC-7).
#   # Admin and member sign-in and both password changes, each counted separately.
#   login: { max: 10, windowMinutes: 15 }
#   # First-run setup.
#   setup: { max: 10, windowMinutes: 15 }
#   # Backup restore uploads (preview and restore).
#   adminUploads: { max: 120, windowMinutes: 15 }

# --- Keys that can also be set in the dashboard ----------------------------

# site:
#   # Name shown in the header and the browser title (1-100 characters).
#   title: AGT Galactic Trivia
#   # Support link: an absolute http: or https: URL.
#   supportUrl: https://www.nms-agt.com/support

# quiz:
#   # Questions in a short quiz (1-100, less than longLength).
#   shortLength: 10
#   # Questions in a long quiz (2-500, more than shortLength).
#   longLength: 30

# backup:
#   # Largest backup upload in bytes (1024-2147483648).
#   maxZipBytes: 209715200
#   # Largest total uncompressed size of an uploaded backup (1024-8589934592).
#   maxUncompressedBytes: 1073741824
#   # Most entries an uploaded backup archive may contain (1-100000).
#   maxEntries: 10000

# logs:
#   # Days the server log keeps an entry (1-3650).
#   serverRetentionDays: 30
#   # Most entries the server log keeps (1000-10000000); the oldest go first.
#   serverMaxEntries: 100000
#   # Days the audit log keeps an entry (30-3650).
#   auditRetentionDays: 365
#   # Most entries the audit log keeps (10000-10000000); failures go first.
#   auditMaxEntries: 1000000

# iam:
#   # AGT sign-in: members sign in with their AGT account through AGT IAM
#   # (README, AGT sign-in). Off by default; also editable in the dashboard.
#   # Needs baseUrl, appId and AGT_TRIVIA_IAM_API_KEY in .env.
#   enabled: false
#   # The AGT IAM address: https://, or http:// only to localhost.
#   baseUrl: https://iam.example.org
#   # The App ID AGT IAM registered for this installation.
#   appId: agt-trivia
#   # How long a sign-in waits for AGT IAM, in seconds (1-30).
#   timeoutSeconds: 10
#   # The role of an authorized traveller whose AGT tier roleMap does not name.
#   defaultRole: Player
#   # AGT IAM tier -> role (Player, Editor or Moderator). The tiers NOACCESS and
#   # NONE never sign in.
#   roleMap: { Editor: Editor, Moderator: Moderator }
